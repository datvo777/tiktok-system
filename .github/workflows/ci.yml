# Nothing built, tested or checked anything on push before this: the only thing
# between a broken commit and `dev` was remembering to run Maven locally with
# Docker up.
#
# Two jobs rather than one, because they fail for unrelated reasons and a red
# tick should say which half is broken. The clients are fast; the Java side is
# not, and its integration tests need Docker.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Clients
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # One lockfile at the root: the two clients and the package they share
          # are npm workspaces, so they resolve together or not at all.
          cache-dependency-path: package-lock.json

      # `ci`, not `install`: the lockfile is the input, and a build that quietly
      # resolves different versions than the one that was reviewed is not a check.
      # Installed once at the root, which also links the shared workspace package.
      - run: npm ci

      - name: Lint
        run: npm run lint --workspace ${{ matrix.app }}

      - name: Typecheck and build
        run: npm run build --workspace ${{ matrix.app }}

      - name: Test
        run: npm test --workspace ${{ matrix.app }} --if-present

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # `verify`, not `test`: the integration tests are bound to the failsafe
      # plugin's integration-test phase and would not run otherwise. Testcontainers
      # uses the Docker daemon that is already present on this runner.
      - name: Build and test
        run: mvn -B -ntp verify
