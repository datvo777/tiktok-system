spring:
  application:
    name: media-worker
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: media-worker
      auto-offset-reset: earliest
      # The Video module owns idempotence via its inbox; the worker still commits
      # only after a job completes.
      enable-auto-commit: false
      properties:
        # The listener runs the whole transcode before returning to poll(). The default of 5
        # minutes is shorter than worker.job-timeout (15), so a long job got the consumer evicted
        # from the group, never committed, and was redelivered and run again.
        max.poll.interval.ms: ${WORKER_MAX_POLL_INTERVAL_MS:1800000}

server:
  port: 8090

shortvideo:
  worker:
    max-concurrent-jobs: ${WORKER_MAX_CONCURRENT_JOBS:2}
    job-timeout: ${WORKER_JOB_TIMEOUT_SECONDS:900}s
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Scoped service account rather than root: this process feeds attacker-supplied
    # bytes to ffmpeg, so it is the last one that should hold cluster-wide
    # credentials. minio-init mints it.
    access-key: ${MINIO_APP_ACCESS_KEY:short-video-app}
    secret-key: ${MINIO_APP_SECRET_KEY:short-video-app-secret}
    bucket: ${MINIO_BUCKET:short-video}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    com.shortvideo: DEBUG
