# Reverse proxy for the web app, the API and the realtime stream (see README.md in this directory).
#
# The backend runs on the host, not in Compose, hence host.docker.internal. Everything that is a
# number here was either measured (docs/sse-vs-polling-benchmark.md) or is marked as not measured.

worker_processes auto;
# Each streaming user costs about three descriptors on the proxy: the browser's stream, the upstream
# connection of that stream, and the browser's idle connection for REST (measured: 12.4k for 4,000 users).
worker_rlimit_nofile 65535;
# A reload leaves the old workers alive until their connections end; a stream lasts 20-28 minutes.
worker_shutdown_timeout 30s;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    # Counts client AND upstream connections, so a stream uses two.
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # uct is the time spent connecting to the backend: non-zero means this request opened a new
    # connection instead of reusing one from the keepalive pool, which is how to size `keepalive` below.
    log_format main '$remote_addr "$request" $status rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    # Slow or stalled clients should not hold a connection for long. Not applied to the stream, which
    # sends nothing from the client after the request.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    # Uploads go straight to MinIO with a presigned POST; the API only takes small JSON bodies.
    client_max_body_size 2m;
    # The browser's idle REST connection costs a descriptor here for as long as it is kept. Short, because
    # with a stream open REST is used about once a minute. Not measured at the proxy.
    keepalive_timeout 20s;
    reset_timedout_connection on;

    # event-stream is deliberately absent: compression buffers, and the stream must flush each event.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    upstream backend {
        server host.docker.internal:8080;
        # Idle connections kept per worker for REST; it does not cap the connections opened. Streams never
        # come from this pool (each holds its own connection for its whole life). Size it with `uct` above.
        keepalive 64;
        # Shorter than Tomcat's 60 s keep-alive: otherwise nginx reuses a connection Tomcat has just
        # closed and answers 502.
        keepalive_timeout 30s;
        keepalive_requests 10000;
    }

    server {
        listen 80 backlog=4096;

        # What every proxied location shares. X-Forwarded-For is overwritten, not appended: the backend
        # takes the last hop (shortvideo.rate-limit.trusted-hop-count=1), and a client-supplied value
        # must not survive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast: with the default 60 s a backend that is down or full looks like a hang.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Admin, operations and API documentation are not for the public edge. The admin app reaches
        # the backend through its own dev proxy, and Prometheus scrapes the backend directly.
        location ^~ /internal/ { return 404; }
        location ^~ /actuator/ { return 404; }
        location ~ ^/(v3/api-docs|swagger-ui) { return 404; }

        # The realtime stream. Own location because it breaks every default above:
        # it is idle on the client side, it lasts up to ~28 minutes, and it must not be buffered.
        location = /api/v1/events/stream {
            limit_except GET { deny all; }
            proxy_pass http://backend;
            proxy_buffering off;        # the backend also sends X-Accel-Buffering: no
            proxy_cache off;
            gzip off;
            # Between two reads, not the stream's lifetime: the server pings every 20 s, so this only
            # needs to be well above that. Keep it above the ping interval if that is ever raised.
            proxy_read_timeout 1h;
            access_log off;             # one line per open at thousands of opens is noise
        }

        location /api/ {
            proxy_pass http://backend;
        }

        # HLS segments and posters, streamed through the backend's media gateway. Buffering is left at
        # the default; whether a larger buffer or no temp file suits big segments was not measured.
        location /media/ {
            proxy_pass http://backend;
        }

        # Built web app: hashed assets can be cached for good, the entry page must not be.
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
