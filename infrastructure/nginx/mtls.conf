# Experiment: mutual TLS on the admin hostname only. Not part of the default stack; see
# nginx/README.md ("mTLS for the admin host"). Run with the `mtls` Compose profile after
# nginx/mtls/gen-dev-certs.sh. The names end in .localhost, which browsers resolve to this machine.
#
#   tksystem.localhost         users: web app, API, stream, no client certificate
#   admin.tksystem.localhost   staff: admin app and the admin API, client certificate required

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    upstream backend {
        server host.docker.internal:8080;
        keepalive 16;
        keepalive_timeout 30s;
    }

    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # Anything that is not one of the two names (including a request by IP address) is refused during
    # the handshake, before any HTTP is read.
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        server_name tksystem.localhost;

        location ^~ /internal/ { return 404; }
        location ^~ /actuator/ { return 404; }
        location /api/ { proxy_pass http://backend; }
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }

    server {
        listen 8443 ssl;
        server_name admin.tksystem.localhost;

        ssl_client_certificate /etc/nginx/tls/staff-ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 1;
        # Read at start and on reload only, and every client is refused once the list passes its next-update
        # time (see README.md), so it has to be regenerated and nginx reloaded before then.
        ssl_crl /etc/nginx/tls/staff-ca.crl;

        # Defence in depth. nginx takes the TLS settings from the name in the handshake (SNI) but routes
        # the request by the Host header, so a client could shake hands as the public name, where no
        # certificate is asked for, and send "Host: admin...". nginx 1.29.4 already answers that with
        # 421 on its own (tested with these two checks removed), but that is a behaviour of the version,
        # not something this file should depend on.
        set $guard "";
        if ($ssl_server_name != $host)     { set $guard "mismatch"; }
        if ($ssl_client_verify != SUCCESS) { set $guard "${guard}nocert"; }
        if ($guard != "")                  { return 421; }

        # Only what the admin app calls.
        location = /api/v1/auth/login  { proxy_pass http://backend; }
        location = /api/v1/auth/logout { proxy_pass http://backend; }
        location = /api/v1/auth/me     { proxy_pass http://backend; }
        location = /api/v1/search      { proxy_pass http://backend; }
        location /internal/v1/         { proxy_pass http://backend; }
        location / {
            root /usr/share/nginx/html-admin;
            try_files $uri /index.html;
        }
    }
}
