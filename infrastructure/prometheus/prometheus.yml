global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: short-video-backend
    metrics_path: /actuator/prometheus
    # The backend closes /actuator/** to everyone but admins and lets only this token read
    # /actuator/prometheus. The compose service writes it to this file from METRICS_SCRAPE_TOKEN.
    authorization:
      type: Bearer
      credentials_file: /tmp/scrape_token
    static_configs:
      # Backend runs on the macOS host, not in Compose.
      - targets: ["host.docker.internal:8080"]

  - job_name: media-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
