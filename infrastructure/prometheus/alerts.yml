# Alert rules for failures that otherwise only show up as a log line. Nothing here pages anyone
# yet (there is no Alertmanager in the local stack); they are visible at :9090/alerts.
groups:
  - name: short-video-backend
    rules:
      - alert: OutboxEventsDead
        # Nothing replays or deletes a DEAD row, so every one is an event some consumer never saw.
        expr: outbox_dead_rows > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} outbox event(s) are DEAD"
          description: >-
            The relay gave up publishing these. Consumers (search, eligibility, notifications) are
            missing them until an operator republishes. See platform.outbox_event WHERE status = 'DEAD'.

      - alert: UploadCleanupFailing
        # Failed with nothing reaped in the same window: stuck, not just one bad session.
        expr: increase(upload_cleanup_failed_total[30m]) > 0 and increase(upload_cleanup_reaped_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Expired upload sessions are not being cleaned up
          description: The cleanup job is failing and reaping nothing; expired uploads keep their objects and drafts.

      - alert: VideoAssetPurgeFailing
        expr: increase(video_cleanup_failed_total[30m]) > 0 and increase(video_cleanup_purged_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Superseded and removed video assets are not being purged
          description: Purges are failing in MinIO (permissions or availability); rows stay DELETION_IN_PROGRESS and storage is not reclaimed.

      - alert: KafkaRecordDeadLettered
        # A record reaches a DLT only after its retries are exhausted, and nothing replays it, so the
        # consumer never applied it. The upload-completion fan-out is repaired by the reconciliation job;
        # anything else needs an operator to look at the *.DLT topic (Kafka UI at :8080).
        expr: increase(kafka_consumer_dead_lettered_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} record(s) moved to a dead-letter topic"
          description: >-
            A consumer gave up on a record. See the dlq-alert-sink error log for topic and key, then inspect
            the matching *.DLT topic.

      - alert: UploadCompletionRepaired
        # The listeners lost an upload.completed event and the reconciler had to repair it.
        expr: increase(upload_completion_repaired_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Reconciliation repaired a completed upload that a consumer had missed
          description: Look for a DLT record or a consumer outage around the time of the repair log lines.

      - alert: VideoTranscodeTimedOut
        # The transcode command or its result was lost, or a worker died without reporting.
        expr: increase(video_transcode_timed_out_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Videos were failed after producing no transcode result
          description: Check the media-worker and the media.jobs.v1 / media.results.v1 topics and their DLTs.
