openapi: 3.1.0
info:
  title: Short Video Platform — Account API
  version: v1
  description: >
    Milestone 1 surface. The build fails when a controller and this document
    disagree (brief section 2), so change both in the same commit.

servers:
  - url: http://localhost:5173
    description: Vite dev server (proxies /api, /internal and /media to the backend)
  - url: http://localhost:8080
    description: Backend directly (no cookie-bearing browser flows)

paths:
  /api/v1/accounts:
    post:
      summary: Register an account
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/accounts/{accountId}:
    get:
      summary: Read an account
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/login:
    post:
      summary: Log in and open a session
      description: >
        Returns the token in the body for the SPA's Authorization header AND sets
        it as an HttpOnly session cookie. The cookie is the only credential the
        media gateway can see, because hls.js and the video element cannot send
        request headers (Rule 17).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: sv_session=<jwt>; HttpOnly; SameSite=Lax; Path=/
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: >
            Invalid credentials, or the account is not active. Both answer with
            identical wording so the response does not reveal which addresses are
            registered or which accounts are suspended.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/auth/logout:
    post:
      summary: Clear the session cookie
      operationId: logout
      security: []
      responses:
        '204':
          description: Session cleared

  /internal/v1/accounts/{accountId}/suspend:
    post:
      summary: Suspend an account (admin)
      operationId: suspendAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: sv_session

  responses:
    Problem:
      description: RFC 7807 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 100 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      required: [accountId, token, expiresAt]
      properties:
        accountId: { type: string, format: uuid }
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    AccountResponse:
      type: object
      required: [accountId, displayName, state, createdAt]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string }
        state:
          type: string
          enum: [ACTIVE, RESTRICTED, SUSPENDED, DELETED]
        createdAt: { type: string, format: date-time }

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

security:
  - bearerAuth: []
