spring:
  application:
    name: short-video-backend

  # Blocking I/O on virtual threads: the media gateway holds a thread per stream
  # in Milestone 2, so the constraint to watch is bytes and connections, not threads.
  threads:
    virtual:
      enabled: true

  task:
    scheduling:
      # Spring's default is a single thread for every @Scheduled method. Six jobs
      # share this pool, and the outbox relay can block a whole drain cycle
      # publishing a batch of 100 with a 30s per-record timeout. On one thread that
      # starves the revocation cache rebuilder — the one job whose delay has safety
      # consequences — along with every cleanup job.
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:short_video}
    username: ${POSTGRES_APP_USER:short_video_app}
    password: ${POSTGRES_APP_PASSWORD:short_video_app}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never alters it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    # Each module owns its migrations (brief section 9).
    locations: classpath:db/migration/platform,classpath:db/migration/account,classpath:db/migration/upload,classpath:db/migration/video,classpath:db/migration/eligibility,classpath:db/migration/moderation,classpath:db/migration/publication,classpath:db/migration/social,classpath:db/migration/appeal,classpath:db/migration/notification
    schemas: platform
    default-schema: platform
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: short-video-backend
      auto-offset-reset: earliest
      # Durable consumers commit their DB transaction before acknowledging the
      # offset (Rule 5); the listener container factory below acks per record
      # only after the listener method returns without exception.
      enable-auto-commit: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

shortvideo:
  jwt:
    # No default: the application must fail to start rather than sign tokens with
    # a key that is published in this repository. Generate one with
    # `openssl rand -base64 48`. The local profile supplies a throwaway value.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:short-video-local}
    audience: ${JWT_AUDIENCE:short-video-web}
    ttl: ${JWT_TTL_SECONDS:1800}s
    session-cookie-name: ${SESSION_COOKIE_NAME:sv_session}
    # Secure by default: serving a session cookie over plain HTTP should be an
    # explicit opt-out, and one variable drives both cookies so they cannot drift.
    cookie-secure: ${COOKIE_SECURE:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # The scoped service account, not root: a compromise of this process should
    # not be able to touch anything outside this one bucket. minio-init mints it.
    access-key: ${MINIO_APP_ACCESS_KEY:short-video-app}
    secret-key: ${MINIO_APP_SECRET_KEY:short-video-app-secret}
    bucket: ${MINIO_BUCKET:short-video}
  upload:
    cleanup-interval: 15m
  outbox:
    enabled: true
    relay-id: relay-1
    batch-size: 100
    lease: 60s
    poll-interval: 500ms
    publish-timeout: 30s
    max-attempts: 10
  playback:
    cookie-name: ${PLAYBACK_COOKIE_NAME:sv_playback}
    ttl: ${PLAYBACK_COOKIE_TTL_SECONDS:300}s
    cookie-secure: ${COOKIE_SECURE:true}
  media:
    stream-buffer-bytes: ${MEDIA_STREAM_BUFFER_BYTES:131072}
    max-concurrent-streams: ${MEDIA_MAX_CONCURRENT_STREAMS:32}
  feed:
    candidate-pool-size: 200
    page-size: 20
    cache-ttl: 30s
    freshness-weight: 10
    like-weight: 1
    comment-weight: 2
    followed-creator-boost: 15
    exploration-weight: 5
  reconciliation:
    interval: 5m
  lifecycle:
    cleanup-interval: 5m
  opensearch:
    endpoint: ${OPENSEARCH_ENDPOINT:http://localhost:9200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # The detailed report names the datasource URL, broker addresses, disk paths
      # and free space. "always" served all of that to anyone who could reach the
      # port. Admins still see it; the liveness and readiness probes stay public
      # and disclose nothing beyond up/down.
      show-details: when-authorized
      roles: ADMIN
      group:
        readiness:
          include: db,redis,minio,kafka
  metrics:
    tags:
      application: short-video-backend
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[media.authorization]": true
        "[media.revocation_check]": true
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99
        "[media.authorization]": 0.5, 0.95, 0.99
        "[media.revocation_check]": 0.5, 0.95, 0.99
  tracing:
    sampling:
      # Sample everything locally (brief Milestone 8: OpenTelemetry traces).
      # A production deployment would sample a small fraction instead.
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    # INFO by default. DEBUG here logged the viewer's account id and object key on
    # every HLS segment request — a per-segment line carrying a user identifier —
    # and it was on in every profile, not just locally. The local profile turns it
    # back on; the correlation id in the ECS output is the identifier to trace by.
    com.shortvideo: ${LOG_LEVEL_APP:INFO}

---
# Activated with SPRING_PROFILES_ACTIVE=local. Everything unsafe for a real
# deployment lives here rather than in the defaults above.
spring:
  config:
    activate:
      on-profile: local

shortvideo:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes-long}
    # Permits the published placeholder above; refused in every other profile.
    allow-insecure-secret: true
    cookie-secure: false
  playback:
    cookie-secure: false

logging:
  level:
    com.shortvideo: DEBUG
